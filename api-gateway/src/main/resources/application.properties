spring.application.name=api-gateway

server.port=8080

# =========================
# EUREKA
# =========================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# =========================
# USER SERVICE ROUTE
# =========================

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

# INTERNAL AUTH VALIDATION ROUTE
#Auth Service calls User Service directly through Eureka and Feign, so it doesn't need a public Gateway route.
#spring.cloud.gateway.server.webflux.routes[2].id=user-auth-validation
#spring.cloud.gateway.server.webflux.routes[2].uri=lb://user-service
#spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/internal/auth/**


# =========================
# ORDER SERVICE ROUTE
# =========================

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/orders/**

# =========================
# AUTH SERVICE ROUTE
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth/**



# =========================
# ACTUATOR
# =========================

management.endpoint.gateway.access=read-only
management.endpoints.web.exposure.include=health,info,gateway