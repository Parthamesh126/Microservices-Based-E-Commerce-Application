spring.application.name=user-service


server.port = 8081

spring.mongodb.uri = mongodb://localhost:27017/userservice

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone = http://localhost:8761/eureka

#The fallback is for local development only. Set a strong secret through the INTERNAL_AUTH_SECRET 
#environment variable outside local development.
internal.auth.secret=${INTERNAL_AUTH_SECRET:local-dev-internal-secret-change-me}